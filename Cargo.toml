[package]
name = "crawlrs"
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.95"
authors = ["Kirky.X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
description = "crawlrs - Enterprise-grade web scraping and crawling platform built with Rust"
homepage = "https://github.com/Kirky-X/crawlrs"
repository = "https://github.com/Kirky-X/crawlrs"
documentation = "https://docs.rs/crawlrs"
readme = "README.md"
keywords = ["scraping", "crawling", "web-scraping", "data-extraction", "crawler"]
categories = ["web-programming", "web-programming::http-client"]

exclude = []

[features]
# 默认构建保持现有全功能行为：平台全套（多租户 + 认证 + 限流 + Webhook + metrics + content）
default = ["platform"]

# auth-off 的 Web 中间件面（production-mock-purge T037/T038）：
# platform 隐含 auth，auth-off 的 default_identity_middleware 在现有 feature 矩阵中
# 无法编译；本 feature 为 platform 剔除 teams/auth 的等价面（auth-off 语义生效面），
# 供 `--no-default-features --features web-axum --lib` 构建/测试该路径。
web-axum = [
    "rate-limit", "webhook", "metrics", "content",
    "dep:dbnexus", "dep:dbnexus-macros", "dep:axum", "dep:sdforge",
    "inklog/http", "inklog/postgres", "http",
]

# platform：完整平台服务能力面。agent-lib / 嵌入式接入方用 `--no-default-features` 剥离。
# 挂载 platform 的服务端依赖：dbnexus（DB）、axum（HTTP）、sdforge（SDK 宏）。
# garrison/inventory（auth 隐含）、sysinfo（metrics 隐含）已分别挂既有 feature。
platform = [
    "teams", "auth", "rate-limit", "webhook", "metrics", "content",
    "dep:dbnexus", "dep:dbnexus-macros", "dep:axum", "dep:sdforge",
    "inklog/http", "inklog/postgres", "http",
]
# sdforge 0.4 `#[forge]` 宏生成 `cfg(feature = "http")` 门控的 HTTP 路由注册代码
# （inventory submit）。下游 crate 必须显式声明本 feature 才会生成路由。
http = ["sdforge/http"]

standard = ["engine-playwright", "metrics", "content"]
full = ["standard", "engine-flaresolverr", "extractors", "llm"]

llm = ["dep:genai"]

# --- 引擎特性 ---
engine-playwright = ["dep:chromiumoxide", "dep:chromiumoxide_fetcher"]
engine-flaresolverr = []
# TLS 指纹一致性伪装引擎（Phase 1 / D4）：引入 wreq（BoringSSL 后端）实现 WreqEngine。
# 注意：wreq-util（Emulation 便捷枚举）为 GPL-3.0，违反 deny.toml license 白名单，
# 故 TlsEmulation 由本项目自有枚举映射到 wreq 的 EmulationProvider（Apache-2.0 API），不引入 wreq-util。
engine-tls-fingerprint = ["dep:wreq"]
# MLLM 自主导航爬取引擎（Phase 3）：依赖浏览器引擎 + 视觉 LLM
engine-mllm = ["engine-playwright", "llm"]

# --- 内容处理特性（content-processing） ---
# aho-corasick: Tier2 通用词字面量集的多模式匹配（AC 自动机）
# htmd: HTML→Markdown 转换
content = ["dep:aho-corasick", "dep:htmd"]

# --- 正文提取特性（content-processing, T043/R-content-003） ---
# rs-trafilatura: 主路径，移植自 trafilatura，文章正文提取质量最高
trafilatura = ["dep:rs-trafilatura"]
# dom_smoothie: 性能回退，移植自 readability.js，DOM 结构启发式
dom-smoothie = ["dep:dom_smoothie"]
# extractors: 聚合两个 extractor，折叠进 `full`（保证 `--features full` 时全可用）
extractors = ["trafilatura", "dom-smoothie"]

# --- 库面特性（agent-lib：嵌入式/agent 最小库面，不编译 DB/服务端） ---
# 复用 engines/search/content 既有依赖；不引入新第三方依赖（spec constraint）。
agent-lib = ["content", "trafilatura", "dom-smoothie"]

# --- 基础设施特性 ---
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus", "dep:sysinfo"]

# --- 业务能力特性（feature-gate-optional-modules） ---
# 阶段说明：Stage 0 仅声明 feature + 常量；cfg 门控与 Noop* 实现见 Stage 1-4；
# `--no-default-features` 在所有门控就位前会失败（预期，Stage 5 统一验证）。
#
# `teams` 隐含 `auth`：多租户需认证识别租户
teams = ["auth"]
# `auth` 关闭时走 default_identity_middleware 注入固定 AuthState
# （DEFAULT_TEAM_ID/DEFAULT_API_KEY_ID 见 src/common/constants.rs::default_identity）
# garrison-auth-migration：auth-on 改由 garrison 提供认证引擎，故 `auth` 隐含 `dep:garrison`
auth = ["dep:garrison", "dep:inventory"]
# `rate-limit` 门控 limiteron 依赖；关闭时注入 NoopRateLimitingService
rate-limit = ["dep:limiteron"]
# `webhook` 关闭时注入 NoopWebhookService 并移除 /v1/webhooks 路由
webhook = []

# --- 测试特性 ---
test-mocks = []

[dependencies]
# Async runtime and web framework
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
axum = { workspace = true, optional = true }
futures = "0.3"
async-trait = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }

# Serialization and configuration
serde.workspace = true
serde_json.workspace = true
confers.workspace = true
figment.workspace = true

# Error handling
thiserror = "2.0"
anyhow.workspace = true

# Retry with exponential backoff
backon = { version = "1.6", default-features = false, features = ["tokio-sleep"] }

# Security — constant-time comparison for HMAC signature verification
subtle = "2.6"

# HTTP client and networking
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies", "http2", "charset", "system-proxy", "gzip", "brotli", "stream"] }
# TLS 指纹引擎（Phase 1 / D4）：BoringSSL 后端 HTTP 客户端，Apache-2.0。
# wreq 5.x 已被上游全部 yank（2026-08 检查 5.1.0/5.2.0/5.3.0 均 yanked），改用 6.0.0-rc.31。EmulationProvider/EmulationProviderFactory/TlsConfig
# 均为 wreq 自有 API，无需引入 GPL 的 wreq-util。构建需 cmake + C 编译器（BoringSSL）。
wreq = { version = "5.3", default-features = false, optional = true }
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Database
# SAST 修复：jsonwebtoken 已单独声明（仅 hmac+sha2+rand 最小 feature，不开 rsa/p256/p384/ed25519-dalek）
dbnexus = { workspace = true, optional = true }
dbnexus-macros = { version = "0.6.0-rc.1", default-features = false, features = [], optional = true }

sea-orm = { workspace = true }

# Caching and state management
dashmap = "6.2"
once_cell = "1.21"

# Utilities
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
validator.workspace = true
sysinfo = { version = "0.39", optional = true }
dirs = "6.0"

# Logging and observability
log.workspace = true
inklog = { version = "0.3.0-rc.1", default-features = false, features = ["cli"] }
sdforge = { workspace = true, optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"], optional = true }
# inventory：编译期监听器注册（garrison GarrisonListenerEntry 需要，crawlrs 直接使用以注册 CrawlrsAuditListener）
# optional：仅 auth feature 启用时引入（auth = ["dep:garrison", "dep:inventory"]）
inventory = { version = "0.3", default-features = false, optional = true }

# Web scraping and content processing
scraper = { version = "0.27" }
robotstxt = { version = "0.3" }
chromiumoxide = { version = "0.9", optional = true }
chromiumoxide_fetcher = { version = "0.9", optional = true }

# Anti-bot detection — gated by `content` feature (T008/R-antibot-002)
# aho-corasick: Tier2 通用词字面量集的多模式匹配（AC 自动机）
aho-corasick = { version = "1.1", optional = true }

# Markdown conversion — gated by `content` feature (T039/R-content-001)
# htmd: HTML→Markdown 转换主路径（Stage2 P1）
htmd = { version = "0.5", optional = true }

# Content extraction — gated by `trafilatura` / `dom-smoothie` / `extractors` features (T043/R-content-003)
# rs-trafilatura: 主路径，移植自 trafilatura（提取文章正文 + 元数据）
rs-trafilatura = { version = "0.2", default-features = false, optional = true }
# dom_smoothie: 性能回退，移植自 readability.js（DOM 启发式提取）
dom_smoothie = { version = "0.18", default-features = false, optional = true }

# Text processing and encoding
chardetng = { version = "1.0" }
encoding_rs = { version = "0.8" }
deunicode = "1.6"
lru = "0.18"
strsim = "0.11"
html-escape = "0.2"
serde_urlencoded = "0.7"
urlencoding = "2.1"

# Cryptography and encoding
base64.workspace = true
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
bcrypt = "0.19"
zeroize = "1.9"
# Standard Webhooks — webhook 签名/验签标准化（T-webhook-001）
standardwebhooks = { version = "1.0", default-features = false }
# SAST 修复：jsonwebtoken v11 将 features 重组为加密后端选择
# rustCrypto: 纯 Rust 加密后端（替代旧版独立的 hmac/sha2/rand features）
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }

# Network utilities
ipnetwork = "0.21"
# Hickory DNS resolver — 异步 DNS 解析（T-dns-001）
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

# Rate limiting and circuit breaking — gated by `rate-limit` feature
limiteron = { version = "0.3.0-rc.1", default-features = false, optional = true, features = [
    "postgres",
    "ban-manager",
    "quota-control",
    "circuit-breaker",
    "monitoring",
    "parallel-checker",
] }

# Authentication & authorization framework — gated by `auth` feature
# garrison-auth-migration (R-auth-engine-001)：auth-on 改由 garrison 提供认证引擎
# 版本与 dbnexus/oxcache/trait-kit/confers/inklog/sdforge/limiteron 同作者对齐（共享 rc.43 链）
garrison = { version = "0.9.0-rc.1", default-features = false, optional = true, features = [
    "backend-embedded",
    "web-axum",
    "db-postgres",
    "cache-memory",
    "protocol-apikey",
    "protocol-jwt",
    "core-advanced",
    "authorize-api",
    "listener",
    "audit-log",
    "audit-inklog",
    "firewall",
    "firewall-bruteforce",
    "tenant-isolation",
    "tracing-log",
    # three-tier-cache：启用 garrison 内置 L1(oxcache 30s)+L2(DAO 300s)+L3(interface 回调) 三层缓存，
    # 避免 get_permission_list/get_role_list 每次认证都触发 N+1+M 数据库查询（P-CRITICAL-001 修复）。
    "three-tier-cache",
    # protocol-zeroize：JWT secret 使用 Zeroizing<String> 包装，Drop 时清零内存（CWE-316 防护）。
    "protocol-zeroize",
] }

# Concurrency and synchronization
parking_lot = "0.12"

# Regular expressions
regex.workspace = true

# Bloom filter & interner — URL 分层去重（T050-T053/R-frontier-001）
# ahash: bloom 双哈希种子（已存在，复用）
# hashbrown: spider ListBucket 同款 HashSet，比 std HashSet 性能更好
# 规则25：显式声明所需特性，禁止 default-features = true
# hashbrown 0.17 的 ahash 通过 default-hasher 特性提供
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "equivalent", "inline-more"] }

bytes = "1.12"
genai = { version = "0.6", optional = true }
toml = "1.1"

# Dependency Injection
trait-kit = { version = "0.5.0-rc.1", features = ["async", "confers"] }
oxcache = { version = "0.5.0-rc.1", default-features = false, features = ["memory", "serialization", "macros", "batch", "metrics", "bloom"] }
ahash = "0.8"

# Internationalization (i18n) — Mozilla Fluent system
fluent-bundle = "0.16"
fluent-syntax = "0.12"
intl-memoizer = "0.5"
unic-langid = "0.9"

# API Documentation
# 'openapi' is a cfg flag generated by sdforge_macros, declared in [lints.rust.unexpected_cfgs].

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-test = "0.4"
wiremock = "0.6"
reqwest = { version = "0.13", features = ["json"] }
serde_json.workspace = true
cucumber = { version = "0.23", features = ["macros"] }
axum-test = "21.0"
futures = "0.3"
tempfile = "3.27"
uuid = { workspace = true, features = ["v4"] }
criterion = { version = "0.8", features = ["html_reports"] }

testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[[test]]
name = "integration_tests"
path = "tests/integration/mod.rs"
required-features = ["full"]

[[test]]
name = "main"
path = "tests/main.rs"
required-features = ["test-mocks"]


# 临时诊断测试：依赖 presentation（platform 门控），非平台构建时跳过
[[test]]
name = "route_diag_test"
path = "tests/route_diag_test.rs"
required-features = ["platform"]

[[example]]
name = "tls_fingerprint_check"
path = "examples/tls_fingerprint_check.rs"
required-features = ["engine-tls-fingerprint"]

[[bench]]
name = "benchmark"
harness = false
path = "benches/benchmark.rs"

[[bin]]
name = "crawlrs"
path = "src/main.rs"
required-features = ["platform"]

# =============================================================================
# Build Optimization Profiles
# =============================================================================

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true

[workspace]
members = ["examples"]

[workspace.package]
version = "0.2.0-rc.1"
edition = "2021"
rust-version = "1.95"
authors = ["Kirky.X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/crawlrs"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Configuration
confers = { version = "0.6.0-rc.1", default-features = false, features = ["validation", "toml", "env"] }
figment = { version = "0.10", default-features = false, features = ["toml", "json", "yaml", "env"] }
# Error handling
anyhow = "1.0"
# Logging
log = "0.4"
# Utilities
uuid = { version = "1.24", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
rand = "0.10"
validator = { version = "0.21", features = ["derive"] }
# Text processing
regex = "1.13"
# Encoding
base64 = "0.23"
# Database
dbnexus = { version = "0.6.0-rc.1", default-features = false, features = ["postgres", "runtime-tokio-rustls", "cache", "macros", "migration", "config-env", "config-toml", "chrono", "with-uuid", "with-json", "replica-routing", "yaml", "permission"] }
sea-orm = { version = "2.0.1", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
# SDK
sdforge = { version = "0.5.0-rc.1", default-features = false, features = ["http"] }
# Web framework
axum = "0.8"

# =============================================================================
# Target-Specific Dependencies
# =============================================================================
# libc：MmapBloom 的 mmap/munmap 调用所需（T051/R-frontier-001）
# - Linux: MAP_HUGETLB 大页支持（性能优化）
# - 其他 Unix (macOS/BSD): 普通 mmap
# - 非 Unix (Windows/WASM): 不引入，bloom.rs 自动 fallback 到 Vec<u8> heap
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = [
    'cfg(feature, values("platform", "agent-lib", "engine-playwright", "engine-flaresolverr", "engine-tls-fingerprint", "engine-mllm", "metrics", "llm", "standard", "full", "openapi", "test-mocks", "teams", "auth", "rate-limit", "webhook", "content", "trafilatura", "dom-smoothie", "extractors", "http", "observability"))'
]


