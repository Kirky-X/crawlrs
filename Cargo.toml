[package]
name = "crawlrs"
version = "0.2.0-rc.4"
edition = "2021"
rust-version = "1.97"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
description = "crawlrs - Enterprise-grade web scraping and crawling platform built with Rust"
homepage = "https://github.com/Kirky-X/crawlrs"
repository = "https://github.com/Kirky-X/crawlrs"
documentation = "https://docs.rs/crawlrs"
readme = "README.md"
keywords = ["scraping", "crawling", "web-scraping", "data-extraction", "crawler"]
categories = ["web-programming", "web-programming::http-client"]

exclude = []

[features]
# 默认构建保持现有全功能行为：平台全套（多租户 + 认证 + 限流 + Webhook + metrics + content）
default = ["platform", "db-postgres"]

# platform：完整平台服务面（DB/HTTP/SDK 宏）；嵌入式接入用 --no-default-features；驱动见 db-*
platform = [
    "teams", "auth", "rate-limit", "webhook", "metrics", "content",
    "sitemap",
    "dep:dbnexus", "dep:axum",
    "http",
]

# 数据库驱动（dbnexus 编译期互斥）：各组透传 dbnexus/garrison/limiteron/inklog，共享 runtime-tokio-rustls
db-postgres = [
    "dbnexus?/postgres", "dbnexus?/runtime-tokio-rustls",
    # replica-routing 必须保留：inklog 的 dbnexus 集成无条件引用 DbConfig.replica_config
    "dbnexus?/replica-routing",
    "garrison?/db-postgres", "limiteron/postgres", "inklog/postgres",
]
db-sqlite = [
    "dbnexus?/sqlite", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing",
    "garrison?/db-sqlite", "limiteron/sqlite", "inklog/sqlite",
]
db-mysql = [
    "dbnexus?/mysql", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing",
    "garrison?/db-mysql", "limiteron/mysql", "inklog/mysql",
]
# `#[forge]` 生成 cfg(feature="http") 门控路由；下游必须声明本 feature 才会注册
http = ["sdforge/http"]
# web-axum：platform 的 auth-off 等价构建面（lib 作用域；platform 隐含 auth 无法覆盖该路径）。
# 不在此绑定 inklog 的数据库驱动：日志落库驱动由 db-* 组透传，否则
# `web-axum,db-sqlite`/`db-mysql` 会与硬编码的 inklog/postgres 混用（dbnexus 编译期报错）。
web-axum = [
    "rate-limit", "webhook", "metrics", "content",
    "dep:dbnexus", "dep:axum",
    "inklog/http", "http",
]
# forge-full：inventory 注册面；与手写 protected/v2 路由互斥（全局收集，并存即 panic）
forge-full = ["http"]
# OpenAPI 3.1：#[forge] handler 经 utoipa::path + inventory 聚合，GET /v1/sdk/openapi.json 输出
openapi = ["http", "sdforge/openapi", "dep:utoipa"]

standard = ["engine-playwright", "metrics", "content", "sitemap"]
full = ["standard", "engine-flaresolverr", "extractors", "llm"]

# llm：LLM 边界（trait + 编排），零外部依赖；vision 经 gateway 承载
llm = []

# RAG 特性（不入 default/full）：rag-local=vecboost 本地推理，远端嵌入/重排
# 兜底经 gateway（fluxweir）承载——rig-core 已退役（fluxweir-llm-gateway T011）
rag-local = ["dep:vecboost"]
rag = ["rag-local", "gateway"]

# --- 网关特性 ---
# gateway：fluxweir 统一 LLM/嵌入/重排出口（嵌入式网关 + SDK）。fluxweir 以
# default-features=false 引入：其 default 携带 db-sqlite，会与 db-postgres 触发
# dbnexus embedded×server-side 互斥 compile_error；db-postgres 对齐 crawlrs 持久化面。
# path 依赖：T015/T016/T019 的 with_pool/build_app_with_pool/TrustedIdentity 为本地
# checkout 交付，registry 0.1.0 不含（nebulaid/vecboost 已转 registry，本项是唯一例外）。
gateway = ["dep:fluxweir", "dep:axum"]

# --- 引擎特性 ---
engine-playwright = ["dep:chromiumoxide"]
engine-flaresolverr = []
# moli 引擎（PoC GO 已过）：内存水位调度器（sysinfo 采样）+ CDP 客户端（chromiumoxide）
engine-moli = ["dep:sysinfo", "dep:chromiumoxide"]
# TLS 指纹引擎用 wreq（BoringSSL）；wreq-util 为 GPL-3.0，故自建 Emulation 映射
engine-tls-fingerprint = ["dep:wreq"]
# MLLM 自主导航爬取引擎依赖浏览器引擎 + 视觉 LLM；
# vision_adapter 经 fluxweir chat 出站，故显式依赖 gateway（无单独编译态）
engine-mllm = ["engine-playwright", "llm", "gateway"]

# 内容处理：aho-corasick 多模式匹配；moli-html2md 主转换器 + htmd 兜底（转换器链）
content = ["dep:aho-corasick", "dep:ego-tree", "dep:moli-html2md", "dep:htmd"]

# alchemize：HTML→Markdown 试验性替代转换器（自研 html 引擎，path 依赖）。
# 上游特性形态（212d1f6/d7bb68d 后）：每个格式一个 feature、依赖全 optional；
# `html` 特性自含 htmd 基础链 + 自研深链（原 html-deep，引擎名未变）。
# 注意：① 上游 rust-version = 1.97.1 高于本仓 1.97——启用本特性的工具链须
# ≥1.97.1，因此不并入 default/standard/full/CI 矩阵；② path 依赖在 cargo 解析期
# 即读取 ../alchemize 清单——本目录缺失该 sibling、或上游 feature 名与本处声明
# 失配时，全部 cargo 命令（含默认构建）解析失败；上游改名须先落库并推送
# （CI sibling 检出取远端 main）。default-features=false 现仅剥离 cli/text
# （sdforge/inklog 等），html 链完整保留；[markdown].converter = "alchemize" 选用
# （编译产物层面默认构建零涉及）。
alchemize = ["dep:alchemize"]

# 正文提取：rs-trafilatura 主路径（移植自 trafilatura，质量最高）
trafilatura = ["dep:rs-trafilatura"]
# dom_smoothie: 性能回退，移植自 readability.js，DOM 结构启发式
dom-smoothie = ["dep:dom_smoothie"]
# extractors: 聚合两个 extractor，折叠进 `full`（保证 `--features full` 时全可用）
extractors = ["trafilatura", "dom-smoothie"]

# sitemap：quick-xml 流式解析（边解析边入 frontier）
sitemap = ["dep:quick-xml"]

# agent-lib：嵌入式/agent 最小库面，不编译 DB/服务端，不引入新依赖
agent-lib = ["content", "trafilatura", "dom-smoothie"]

# --- 基础设施特性 ---
# cache-redis：oxcache Redis 后端（多实例共享缓存）。默认不编译：
# `[cache] backend=redis` 在未编译时启动 fail-closed 拒绝（fail-closed 语义）
cache-redis = ["oxcache/redis"]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus", "dep:sysinfo"]

# 业务能力：teams 隐含 auth（多租户需认证识别租户）
teams = ["auth"]
# auth 关闭时注入固定 AuthState；开启时由 garrison 提供认证引擎（隐含 dep:garrison）
auth = ["dep:garrison", "dep:inventory"]
# rate-limit：关闭时注入 NoopRateLimitingService（limiteron 已非可选）
rate-limit = []
# `webhook` 关闭时注入 NoopWebhookService 并移除 /v1/webhooks 路由
webhook = []

# --- 测试特性 ---
test-mocks = []

[dependencies]
# Async runtime and web framework
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
axum = { workspace = true, optional = true, features = ["ws"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = { version = "0.1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["trace", "cors"] }

# Serialization and configuration
serde.workspace = true
serde_json.workspace = true
confers.workspace = true

# Error handling
thiserror = { version = "2.0", default-features = false, features = ["std"] }
anyhow.workspace = true

# Retry with exponential backoff

# Security — constant-time comparison for HMAC signature verification
subtle = { version = "2.6", default-features = false, features = ["std", "i128"] }

# HTTP client and networking
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies", "http2", "charset", "system-proxy", "gzip", "brotli", "stream"] }
# wreq BoringSSL 客户端（5.x 已 yanked，暂用 6.0.0-rc.31）；cookies/解压/stream 特性缺失会导致会话丢失或乱码
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["tokio-rt", "cookies", "gzip", "brotli", "zstd", "charset", "stream"], optional = true }
url = { version = "2.5", default-features = false, features = ["std"] }

# Database
# dbnexus-macros 与 jsonwebtoken 已移除（审计：src 零引用，JWT 由 garrison 提供）
dbnexus = { workspace = true, optional = true }

# Caching and state management
dashmap = { version = "6.2", default-features = false }
once_cell = { version = "1.21", default-features = false, features = ["std"] }

# Utilities
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system"], optional = true }
dirs = { version = "7.0", default-features = false }

# Logging and observability
log.workspace = true
# inklog rc.12 嵌入基线（与 fluxgate 同链）；仅 cli 特性，不引 fast-masking（曾有 panic 实证）
inklog = { version = "0.3.0-rc.12", default-features = false, features = ["cli"] }
# sdforge 非可选：DTO 层 Validate impl 未做 feature 门控
sdforge.workspace = true
metrics = { version = "0.24", default-features = false, optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"], optional = true }
# inventory：编译期监听器注册（GarrisonListenerEntry + CrawlrsAuditListener；仅 auth）
inventory = { version = "0.3", default-features = false, optional = true }

# Web scraping and content processing
scraper = { version = "0.29", default-features = false, features = ["errors", "main"] }
robotstxt = { version = "0.3", default-features = false }
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"], optional = true }
# chromiumoxide_fetcher 已移除：死依赖且硬绑 zip8，触发 RUSTSEC-2026-0367/68/69

# aho-corasick：Tier2 通用词多模式匹配（AC 自动机）
aho-corasick = { version = "1.1", default-features = false, features = ["std", "perf-literal"], optional = true }

# htmd：HTML→Markdown 转换主路径
htmd = { version = "0.5", default-features = false, optional = true }
# moli-html2md：钉 release v1.1.21 锚定 commit（同 moli 二进制 PoC 版本）；只编译该
# member（独立 crate，运行时依赖仅 icu_properties，无浏览器/V8 耦合）
moli-html2md = { version = "0.1.0", git = "https://github.com/lexmount/moli", rev = "2db52b45ba47874bb85b59f6f8793a8786669f47", default-features = false, optional = true } # pragma: allowlist secret — rev 是 commit SHA 非密钥
# alchemize：自研 HTML→Markdown 引擎仓（`html` 特性=htmd 基础链+自研深链），path 依赖试验接入（见 features 段注释）
alchemize = { path = "../alchemize", optional = true, default-features = false, features = ["html"] }
# scraper 内部树（ego-tree 0.11）——moli-html2md Dom 适配器需要命名字典树 NodeId；
# 版本须与 scraper 0.29 的 ego-tree 依赖一致（类型同一性），仅 content 特性使用
ego-tree = { version = "0.11", default-features = false, optional = true }

# rs-trafilatura：正文提取主路径（正文 + 元数据）
rs-trafilatura = { version = "0.2", default-features = false, optional = true }
# dom_smoothie: 性能回退，移植自 readability.js（DOM 启发式提取）
dom_smoothie = { version = "0.19", default-features = false, optional = true }

# quick-xml：sitemap 流式解析（边解析边入 frontier，不整树物化）
quick-xml = { version = "0.42", default-features = false, optional = true }

# Text processing and encoding
chardetng = { version = "1.0", default-features = false }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
lru = { version = "0.19", default-features = false, features = ["hashbrown"] }
html-escape = { version = "0.3", default-features = false, features = ["std"] }
serde_urlencoded = { version = "0.7", default-features = false }
urlencoding = { version = "2.1", default-features = false }

# Cryptography and encoding
base64.workspace = true
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
bcrypt = { version = "0.19", default-features = false, features = ["std", "zeroize"] }
# Standard Webhooks — webhook 签名/验签标准化（T-webhook-001）
standardwebhooks = { version = "1.0", default-features = false }

# Network utilities
ipnetwork = { version = "0.21", default-features = false }
# Hickory DNS resolver — 异步 DNS 解析（T-dns-001）
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

# Rate limiting and circuit breaking — gated by `rate-limit` feature
limiteron = { version = "0.3.0-rc.10", default-features = false, features = [
    # postgres 驱动由 crawlrs db-* 特性组透传 limiteron?/postgres
    "ban-manager",
    "quota-control",
    "circuit-breaker",
    "monitoring",
    "parallel-checker",
    # IP 限流中间件的同步固定窗口（rate_limit_middleware）+ 引擎退避（utils/backoff）
    "sync",
    "retry",
] }

# garrison 认证引擎（auth feature）；rc.5 与自研 rc 链对齐，事件枚举已在 listener 适配
garrison = { version = "0.9.0-rc.5", default-features = false, features = ["backend-embedded", "web-axum", "cache-memory", "protocol-apikey", "protocol-jwt", "core-advanced", "authorize-api", "listener", "audit-log", "audit-inklog", "firewall", "firewall-bruteforce", "tenant-isolation", "tracing-log", "three-tier-cache", "protocol-zeroize", "db-retry"], optional = true }

# Concurrency and synchronization
parking_lot = { version = "0.13", default-features = false }

# Regular expressions
regex.workspace = true

# URL 去重：hashbrown HashSet + ahash 双哈希种子（性能优于 std）
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "equivalent", "inline-more"] }

bytes = { version = "1.12", default-features = false, features = ["std"] }
# llm prompt 模板加载（domain/services/llm/prompt_builder.rs）运行时解析 toml
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }

# vecboost 本地嵌入/重排（rag-local）；关闭服务面避免 dbnexus 互斥 compile_error
vecboost = { version = "0.3.0-rc.3", optional = true, default-features = false }

# Dependency Injection
trait-kit = { version = "0.5.0-rc.12", default-features = false, features = ["async", "confers", "shutdown"] }
# NebulaId registry 依赖（rc.4 已发布，与本地 checkout 源码一致）；仅 sdk 特性
nebulaid = { version = "0.3.0-rc.4", default-features = false, features = ["sdk", "uuid-v8"] }
# oxcache 特性裁剪：memory + serialization + metrics + bloom（macros/batch 零使用）
oxcache = { version = "0.5.0-rc.12", default-features = false, features = ["memory", "serialization", "metrics", "bloom"] }
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }

# Internationalization (i18n) — Mozilla Fluent system
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
# 系统语言检测（unify-rust-i18n 检测链末端：env 链之后探测 OS locale）
sys-locale = { version = "0.3", default-features = false }

# utoipa 6.0：与 sdforge 0.5.0-rc.10 的 re-export 同版（sdforge rc.9 起依赖 ^6.0；
# 回退到 rc.6 及更早需同步退回 5.5，否则双版本共存触发 E0659）
utoipa = { version = "6.0", optional = true, default-features = false, features = ["macros"] }

# fluxweir LLM 网关（gateway 特性）：registry 0.1.1（已含嵌入式单池共享
# build_app_with_pool 与可信代理身份桥，此前 0.1.0 缺该 API 故暂用 git rev 2d559ad，
# 0.1.1 发布后回归 registry）。
# default-features=false 剥离其 db-sqlite 默认后端（dbnexus embedded×server-side 互斥守卫），
# db-postgres 对齐共享池。feature 统一附带效应：inklog/trait-kit/confers/oxcache/sdforge/
# limiteron 随 fluxweir 版本需求解析上移，回归验证见 fluxweir-llm-gateway T021。
fluxweir = { version = "0.1.1", optional = true, default-features = false, features = ["full", "db-postgres"] }

[dev-dependencies]
# dbnexus 恒可用：test_helpers 经 dbnexus::sea_orm re-export，任意 feature 组合可编译
dbnexus = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-test = { version = "0.4", default-features = false }
wiremock = { version = "0.6", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
cucumber = { version = "0.23", default-features = false, features = ["macros"] }
axum-test = { version = "21.1", default-features = false, features = ["pretty-assertions", "ws"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
uuid = { workspace = true, features = ["v4"] }
# rayon/plotters 为默认携带的报表渲染件，html_reports 走 chart.js 不需要
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "html_reports"] }

# 钉 testcontainers 0.27（modules 0.15 要求 ^0.27）；default-features 剥离 ring
testcontainers = { version = "0.27", default-features = false }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres"] }

[[test]]
name = "integration_tests"
path = "tests/integration/mod.rs"
# test-mocks：garrison 全局态重置，仅集成测试使用
required-features = ["full", "test-mocks"]

[[test]]
name = "main"
path = "tests/main.rs"
required-features = ["test-mocks"]

[[test]]
name = "sdk_api_test"
path = "tests/sdk_api_test.rs"
required-features = ["test-mocks"]

# 临时诊断测试：依赖 presentation（platform 门控），非平台构建时跳过
[[test]]
name = "route_diag_test"
path = "tests/route_diag_test.rs"
required-features = ["platform"]

# WebSocket 任务状态端点（spec: ws-task-status；真实 PostgreSQL）
[[test]]
name = "ws_task_status"
path = "tests/ws_task_status.rs"
required-features = ["platform"]

# BDD 套件：cucumber 自管 main，必须 harness=false，否则 0 tests 虚绿
[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
harness = false
required-features = ["platform"]

[[bench]]
name = "benchmark"
harness = false
path = "benches/benchmark.rs"

[[bin]]
name = "crawlrs"
path = "src/main.rs"
required-features = ["platform"]

# Build Optimization Profiles

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true

[workspace]
members = ["examples"]

[workspace.package]
version = "0.2.0-rc.4"
edition = "2021"
rust-version = "1.97"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/crawlrs"

[workspace.dependencies]
# Async runtime（tokio 1.x default = []，显式关闭默认特性仅为声明纪律）
tokio = { version = "1.54", default-features = false, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
# Serialization
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# Configuration
confers = { version = "0.6.0-rc.13", default-features = false, features = ["validation", "toml", "env", "security-rules"] }
# Error handling
anyhow = { version = "1.0", default-features = false, features = ["std"] }
# Logging
log = { version = "0.4", default-features = false, features = ["std"] }
# Utilities
uuid = { version = "1.29", default-features = false, features = ["std", "v4", "serde"] }
# clock 显式声明：response_builder 等 Utc::now() 此前靠依赖图 feature 并集隐式获得
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
# Text processing
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
# Encoding（simd-unsafe 为上游默认携带的非对齐读 SIMD，产物裁剪时一并剥离）
base64 = { version = "0.23", default-features = false, features = ["std"] }
# 驱动/runtime 特性不在此声明，由 db-postgres/db-sqlite/db-mysql 特性组选择
dbnexus = { version = "0.6.0-rc.11", default-features = false, features = ["cache", "macros", "migration", "auto-migrate", "config-env", "with-chrono", "with-uuid", "with-json", "yaml", "permission", "health-check", "prepare-cache"] }
sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
# SDK
sdforge = { version = "0.5.0-rc.10", default-features = false, features = ["http"] }
# Web framework（form/matched-path/original-uri/tower-log/tracing 全仓零引用，裁掉）
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }

[lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = [
    'cfg(feature, values("platform", "agent-lib", "engine-playwright", "engine-flaresolverr", "engine-tls-fingerprint", "engine-mllm", "engine-moli", "metrics", "llm", "standard", "full", "openapi", "test-mocks", "teams", "auth", "rate-limit", "webhook", "content", "trafilatura", "dom-smoothie", "extractors", "http", "observability", "db-postgres", "db-sqlite", "db-mysql", "rag", "rag-local", "gateway"))'
]
