[package]
name = "crawlrs"
version = "0.2.0-rc.2"
edition = "2021"
rust-version = "1.97"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
description = "crawlrs - Enterprise-grade web scraping and crawling platform built with Rust"
homepage = "https://github.com/Kirky-X/crawlrs"
repository = "https://github.com/Kirky-X/crawlrs"
documentation = "https://docs.rs/crawlrs"
readme = "README.md"
keywords = ["scraping", "crawling", "web-scraping", "data-extraction", "crawler"]
categories = ["web-programming", "web-programming::http-client"]

exclude = []

[features]
# 默认构建保持现有全功能行为：平台全套（多租户 + 认证 + 限流 + Webhook + metrics + content）
default = ["platform", "db-postgres"]

# platform：完整平台服务能力面。agent-lib / 嵌入式接入方用 `--no-default-features` 剥离。
# 挂载 platform 的服务端依赖：dbnexus（DB）、axum（HTTP）、sdforge（SDK 宏）。
# garrison/inventory（auth 隐含）、sysinfo（metrics 隐含）已分别挂既有 feature。
# 数据库驱动不在 platform 内——由 db-postgres / db-sqlite / db-mysql 按构建选择。
# 注：inklog/http 不再挂载——telemetry.rs 的 http_server 恒为 None（有测试固化），
# 该 feature 只增加编译面无运行时收益。
platform = [
    "teams", "auth", "rate-limit", "webhook", "metrics", "content",
    "sitemap",
    "dep:dbnexus", "dep:axum",
    "http",
]

# === 数据库驱动（互斥由 dbnexus 编译期强制：embedded 与 server-side 不可混，postgres/mysql 互斥）===
# 每组透传全链路驱动选择：dbnexus（DB 抽象）+ garrison（认证存储）+ limiteron（限流存储）+ inklog（日志落库）。
# runtime-tokio-rustls 为三组共享的 sea-orm 运行时（互斥组内唯一启用）。
db-postgres = [
    "dbnexus?/postgres", "dbnexus?/runtime-tokio-rustls",
    # replica-routing 必须保留：inklog 的 dbnexus 集成无条件引用 DbConfig.replica_config
    "dbnexus?/replica-routing",
    "garrison?/db-postgres", "limiteron/postgres", "inklog/postgres",
]
db-sqlite = [
    "dbnexus?/sqlite", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing",
    "garrison?/db-sqlite", "limiteron/sqlite", "inklog/sqlite",
]
db-mysql = [
    "dbnexus?/mysql", "dbnexus?/runtime-tokio-rustls", "dbnexus?/replica-routing",
    "garrison?/db-mysql", "limiteron/mysql", "inklog/mysql",
]
# sdforge 0.4 `#[forge]` 宏生成 `cfg(feature = "http")` 门控的 HTTP 路由注册代码
# （inventory submit）。下游 crate 必须显式声明本 feature 才会生成路由。
http = ["sdforge/http"]
# web-axum：platform 剔除 teams/auth 的等价构建面（auth-off 语义生效面，恢复自 v0.2.0-rc.1）。
# platform 隐含 auth，auth-off 的 default_identity_middleware / allow_unauthenticated_protected
# 在现有 feature 矩阵中无法编译；本 feature 供 `--no-default-features --features web-axum --lib`
# 构建/测试该路径（lib 作用域；平台二进制仍走 platform）。
web-axum = [
    "rate-limit", "webhook", "metrics", "content",
    "dep:dbnexus", "dep:axum",
    "inklog/http", "inklog/postgres", "http",
]
# forge-full：激活 presentation/forge_api 的 sdforge inventory 注册面（单一注册面迁移停机坪）。
# 与手写 protected/v2 路由组互斥（inventory 全局收集，并存即启动 panic）——见 presentation/mod.rs 说明。
forge-full = ["http"]
# OpenAPI 3.1 规范（吸收自研 sdforge `openapi`）：`#[forge]` handler 经
# `cfg_attr(feature = "openapi", utoipa::path)` 标注，路由元数据经 inventory 聚合，
# GET /v1/sdk/openapi.json 输出完整 spec。
openapi = ["http", "sdforge/openapi", "dep:utoipa"]

standard = ["engine-playwright", "metrics", "content", "sitemap"]
full = ["standard", "engine-flaresolverr", "extractors", "llm"]

llm = ["dep:genai"]

# --- RAG 能力特性（嵌入 + 重排，最小引入：不入 default / full） ---
# rag-local: vecboost 进程内本地推理（Candle CPU；嵌入与重排共用一个 bi-encoder 模型）
# rag-remote: rig-core 远端嵌入（OpenAI 兼容端点，显式 api_key + base_url）
# 远端重排走通用 HTTP rerank 适配（仅 reqwest，无需 feature，见 infrastructure/services/http_rerank_provider.rs）
rag-local = ["dep:vecboost"]
rag-remote = ["dep:rig-core"]
rag = ["rag-local", "rag-remote"]

# --- 引擎特性 ---
engine-playwright = ["dep:chromiumoxide", "dep:chromiumoxide_fetcher"]
engine-flaresolverr = []
# TLS 指纹一致性伪装引擎引入 wreq（BoringSSL 后端）实现 WreqEngine。
# 注意：wreq-util（Emulation 便捷枚举）为 GPL-3.0，违反 deny.toml license 白名单，
# 故 TlsEmulation 由本项目自有枚举映射到 wreq 的 EmulationProvider（Apache-2.0 API），不引入 wreq-util。
engine-tls-fingerprint = ["dep:wreq"]
# MLLM 自主导航爬取引擎依赖浏览器引擎 + 视觉 LLM
engine-mllm = ["engine-playwright", "llm"]

# --- 内容处理特性（content-processing） ---
# aho-corasick: Tier2 通用词字面量集的多模式匹配（AC 自动机）
# htmd: HTML→Markdown 转换
content = ["dep:aho-corasick", "dep:htmd"]

# --- 正文提取特性（content-processing） ---
# rs-trafilatura: 主路径，移植自 trafilatura，文章正文提取质量最高
trafilatura = ["dep:rs-trafilatura"]
# dom_smoothie: 性能回退，移植自 readability.js，DOM 结构启发式
dom-smoothie = ["dep:dom_smoothie"]
# extractors: 聚合两个 extractor，折叠进 `full`（保证 `--features full` 时全可用）
extractors = ["trafilatura", "dom-smoothie"]

# --- 站点图特性（sitemap） ---
# quick-xml: sitemap/sitemapindex 流式解析（可背压请求源 + 断点续爬的解析层）
sitemap = ["dep:quick-xml"]

# --- 库面特性（agent-lib：嵌入式/agent 最小库面，不编译 DB/服务端） ---
# 复用 engines/search/content 既有依赖；不引入新第三方依赖（spec constraint）。
agent-lib = ["content", "trafilatura", "dom-smoothie"]

# --- 基础设施特性 ---
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus", "dep:sysinfo"]

# --- 业务能力特性 ---
# `teams` 隐含 `auth`：多租户需认证识别租户
teams = ["auth"]
# `auth` 关闭时走 default_identity_middleware 注入固定 AuthState
# （DEFAULT_TEAM_ID/DEFAULT_API_KEY_ID 见 src/common/constants.rs::default_identity）
# auth-on 改由 garrison 提供认证引擎，故 `auth` 隐含 `dep:garrison`
auth = ["dep:garrison", "dep:inventory"]
# `rate-limit` 门控限流行为（limiteron 已转非可选：utils/backoff 引擎退避无条件依赖其 retry 原语）；关闭时注入 NoopRateLimitingService
rate-limit = []
# `webhook` 关闭时注入 NoopWebhookService 并移除 /v1/webhooks 路由
webhook = []

# --- 测试特性 ---
test-mocks = []

# vecboost 修复版（本地一等仓库）：confers 0.6.0-rc.6 加密 API 适配
# （derive_field_key/decrypt 返回 Zeroizing）。上游发 rc.2 后可移除本段。
[patch.crates-io]
vecboost = { path = "../vecboost" }

[dependencies]
# Async runtime and web framework
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
axum = { workspace = true, optional = true }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = { version = "0.1", default-features = false }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["trace", "cors"] }

# Serialization and configuration
serde.workspace = true
serde_json.workspace = true
confers.workspace = true

# Error handling
thiserror = { version = "2.0", default-features = false, features = ["std"] }
anyhow.workspace = true

# Retry with exponential backoff

# Security — constant-time comparison for HMAC signature verification
subtle = { version = "2.6", default-features = false, features = ["std", "i128"] }

# HTTP client and networking
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies", "http2", "charset", "system-proxy", "gzip", "brotli", "stream"] }
# TLS 指纹引擎 BoringSSL 后端 HTTP 客户端，Apache-2.0。
# wreq 5.x 稳定版已全部 yanked，暂用 6.0.0-rc.31（唯一可用版本）。
# EmulationProvider/EmulationProviderFactory/TlsConfig
# 均为 wreq 自有 API，无需引入 GPL 的 wreq-util。构建需 cmake + C 编译器（BoringSSL）。
# features：cookies（会话保持）/ gzip / brotli / zstd（解压，accept-encoding 与之一致）/ charset（非 UTF8 解码）
# / stream（bytes_stream 限长读取）——
# 缺 cookies 时 Set-Cookie 完全不处理（挑战通过后无法保持会话）；缺解压时服务器强推 gzip 会得到乱码。
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["tokio-rt", "cookies", "gzip", "brotli", "zstd", "charset", "stream"], optional = true }
url = { version = "2.5", default-features = false, features = ["std"] }

# Database
# dbnexus-macros 已移除（2026-09-19 审计）：src 零引用，宏经 dbnexus re-export。
# jsonwebtoken 直接声明已移除（2026-10-03 审计）：src 全仓零引用的死依赖，
# JWT 能力由 garrison(auth feature) 自带；直接声明只会把 rsa 塞进全部消费方依赖树。
dbnexus = { workspace = true, optional = true }

# Caching and state management
dashmap = { version = "6.2", default-features = false }
once_cell = { version = "1.21", default-features = false, features = ["std"] }

# Utilities
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
sysinfo = { version = "0.39", default-features = false, features = ["system"], optional = true }
dirs = { version = "7.0", default-features = false }

# Logging and observability
log.workspace = true
# rc.6：registry rc.7 的 fast-masking 在日志行上 fancy_regex unwrap
# BacktrackLimitExceeded 直接 panic（消费方主仓 sinnan 真实环境启动即炸实证）；
# telemetry.rs 的配置映射即按 rc.6 语义编写（未配置 = 内置兜底采样）。上游修复
# 发版后再随主仓一并收敛 rc.7+。
inklog = { version = "0.3.0-rc.6", default-features = false, features = ["cli"] }
# sdforge 非可选：DTO 层 Validate impl（sdforge::validator 重导出）未做 feature 门控，
# validator 直依赖已移除，基础验证类型恒经 sdforge 提供
sdforge.workspace = true
metrics = { version = "0.24", default-features = false, optional = true }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"], optional = true }
# inventory：编译期监听器注册（garrison GarrisonListenerEntry 需要，crawlrs 直接使用以注册 CrawlrsAuditListener）
# optional：仅 auth feature 启用时引入（auth = ["dep:garrison", "dep:inventory"]）
inventory = { version = "0.3", default-features = false, optional = true }

# Web scraping and content processing
scraper = { version = "0.27", default-features = false, features = ["errors", "main"] }
robotstxt = { version = "0.3", default-features = false }
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes"], optional = true }
chromiumoxide_fetcher = { version = "0.9", default-features = false, features = ["rustls", "zip8"], optional = true }

# Anti-bot detection — gated by `content` feature
# aho-corasick: Tier2 通用词字面量集的多模式匹配（AC 自动机）
aho-corasick = { version = "1.1", default-features = false, features = ["std", "perf-literal"], optional = true }

# Markdown conversion — gated by `content` feature
# htmd: HTML→Markdown 转换主路径
htmd = { version = "0.5", default-features = false, optional = true }

# Content extraction — gated by `trafilatura` / `dom-smoothie` / `extractors` features
# rs-trafilatura: 主路径，移植自 trafilatura（提取文章正文 + 元数据）
rs-trafilatura = { version = "0.2", default-features = false, optional = true }
# dom_smoothie: 性能回退，移植自 readability.js（DOM 启发式提取）
dom_smoothie = { version = "0.18", default-features = false, optional = true }

# Sitemap 流式解析 — gated by `sitemap` feature
# quick-xml: 流式 pull 解析器（十万级 URL sitemap 边解析边入 frontier，不整树物化）
quick-xml = { version = "0.42", default-features = false, optional = true }

# Text processing and encoding
chardetng = { version = "1.0", default-features = false }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
lru = { version = "0.18", default-features = false, features = ["hashbrown"] }
html-escape = { version = "0.2", default-features = false, features = ["std"] }
serde_urlencoded = { version = "0.7", default-features = false }
urlencoding = { version = "2.1", default-features = false }

# Cryptography and encoding
base64.workspace = true
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false, features = ["alloc", "oid"] }
hex = { version = "0.4", default-features = false, features = ["std"] }
bcrypt = { version = "0.19", default-features = false, features = ["std", "zeroize"] }
# Standard Webhooks — webhook 签名/验签标准化（T-webhook-001）
standardwebhooks = { version = "1.0", default-features = false }

# Network utilities
ipnetwork = { version = "0.21", default-features = false }
# Hickory DNS resolver — 异步 DNS 解析（T-dns-001）
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

# Rate limiting and circuit breaking — gated by `rate-limit` feature
limiteron = { version = "0.3.0-rc.6", default-features = false, features = [
    # postgres 驱动由 crawlrs db-* 特性组透传 limiteron?/postgres
    "ban-manager",
    "quota-control",
    "circuit-breaker",
    "monitoring",
    "parallel-checker",
    # IP 限流中间件的同步固定窗口（rate_limit_middleware）+ 引擎退避（utils/backoff）
    "sync",
    "retry",
] }

# Authentication & authorization framework — gated by `auth` feature
# auth-on 改由 garrison 提供认证引擎
# 版本与 dbnexus/oxcache/trait-kit/confers/inklog/sdforge/limiteron 同作者对齐（共享 rc.43 链）
garrison = { version = "0.9.0-rc.2", default-features = false, features = ["backend-embedded", "web-axum", "cache-memory", "protocol-apikey", "protocol-jwt", "core-advanced", "authorize-api", "listener", "audit-log", "audit-inklog", "firewall", "firewall-bruteforce", "tenant-isolation", "tracing-log", "three-tier-cache", "protocol-zeroize", "db-retry"], optional = true }

# Concurrency and synchronization
parking_lot = { version = "0.12", default-features = false }

# Regular expressions
regex.workspace = true

# Bloom filter & interner — URL 分层去重
# ahash: bloom 双哈希种子（已存在，复用）
# hashbrown: spider ListBucket 同款 HashSet，比 std HashSet 性能更好
# 显式声明所需特性，禁止 default-features = true
# hashbrown 0.17 的 ahash 通过 default-hasher 特性提供
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "equivalent", "inline-more"] }

bytes = { version = "1", default-features = false, features = ["std"] }
genai = { version = "0.6", default-features = false, features = ["rustls-tls"], optional = true }
# llm prompt 模板加载（domain/services/llm/prompt_builder.rs）运行时解析 toml
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

# RAG 能力依赖 — gated by rag-local / rag-remote features（不入 default/full，最小引入）
# vecboost（自研一等仓库，../vecboost）：进程内本地嵌入/重排推理。
# default-features = false 剥离 axum/db/auth 服务面；其 inklog sqlite/kit 已在
# vecboost 侧改为 log-kit/log-sqlite 透传（否则与 db-postgres 触发 dbnexus
# 嵌入式/服务端互斥 compile_error）。Candle CPU 引擎零额外 feature。
vecboost = { version = "0.3.0-rc.1", optional = true, default-features = false }
# rig-core：远端嵌入统一客户端（OpenAI 兼容 Client::builder().api_key().base_url()）。
# 仅用嵌入方向；rig 原生 rerank 只支持 Voyage，远端重排改走自有通用 HTTP 适配。
# reqwest 0.13 + rustls 与 crawlrs 对齐，feature 联合无重复 TLS 栈。
rig-core = { version = "0.44", optional = true, default-features = false, features = ["reqwest", "rustls"] }

# Dependency Injection
trait-kit = { version = "0.5.0-rc.7", default-features = false, features = ["async", "confers", "shutdown"] }
# NebulaId（同作者自研分布式 ID 引擎，../NebulaId 本地路径，不在 crates.io）：
# crawlrs 全量 ID 生成/处理迁移的目标库。default-features=false 剥离 http/grpc/
# garrison-auth/postgresql 服务面，仅留 sdk（纯算法 uuid_v8 零 DB/零号段）。其内部
# dbnexus/sea-orm/uuid/chrono/serde 版本与本仓库 pin 一致，feature 经依赖图并集复用
# 版本与 dbnexus/oxcache/trait-kit/confers/inklog/sdforge/limiteron 同作者对齐。
# 本地 sibling 仓库（../NebulaId）未发布到 registry，直接声明为 path 依赖（不走
# [workspace.dependencies] 间接，避开 cargo-deny 对非成员路径 workspace 依赖的解析限制）。
nebulaid = { path = "../NebulaId", version = "0.3.0-rc.1", default-features = false, features = ["sdk", "uuid-v8"] }
# feature 裁剪（hygiene）：macros/batch/bloom 在 crawlrs 源码中零使用（已 grep 验证），
# 仅保留 memory（L1 缓存）+ serialization（类型化存取）+ metrics（命中统计）。
oxcache = { version = "0.5.0-rc.6", default-features = false, features = ["memory", "serialization", "metrics"] }
ahash = { version = "0.8", default-features = false, features = ["std", "runtime-rng"] }

# Internationalization (i18n) — Mozilla Fluent system
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
# 系统语言检测（unify-rust-i18n 检测链末端：env 链之后探测 OS locale）
sys-locale = { version = "0.3", default-features = false }

# API Documentation
# 'openapi' is a cfg flag generated by sdforge_macros, declared in [lints.rust.unexpected_cfgs].
# 钉 5.5：sdforge 0.5.0-rc.6 依赖并 re-export utoipa 5.5（sdforge lib.rs `pub use utoipa`），
# 消费方升 6.0 会双 utoipa 共存触发 E0659 歧义；待 sdforge 侧 adopt utoipa 6 后协同升级。
utoipa = { version = "5.5", optional = true, default-features = false, features = ["macros"] }

[dev-dependencies]
# dbnexus 恒可用：test_helpers（cfg(test)）与错误类型测试经 dbnexus::sea_orm
# re-export 在任意 feature 组合下可编译（2026-09-19 sea-orm 直依赖收敛）。
dbnexus = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-test = { version = "0.4", default-features = false }
wiremock = { version = "0.6", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json.workspace = true
cucumber = { version = "0.23", default-features = false, features = ["macros"] }
axum-test = { version = "21.1", default-features = false, features = ["pretty-assertions"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tempfile = { version = "3.27", default-features = false, features = ["getrandom"] }
uuid = { workspace = true, features = ["v4"] }
# rayon/plotters 为默认携带的报表渲染件，html_reports 走 chart.js 不需要
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "html_reports"] }

# 历史钉版保持 0.27：testcontainers-modules 最新稳定版 0.15.0 依赖 testcontainers ^0.27.0，
# 升 0.28 会使 modules 的 Postgres 容器类型与本仓 testcontainers API 断裂；
# default-features=false 剥离 ring（aws-lc-rs 可经 rustls 供给，容器走 unix socket 无需 TLS）
testcontainers = { version = "0.27", default-features = false }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres"] }

[[test]]
name = "integration_tests"
path = "tests/integration/mod.rs"
# test-mocks：garrison 全局态重置 API（reset_garrison_global_state_for_integration_test）
# 经该特性门控，集成测试与生产 clippy 面（--features full）解耦
required-features = ["full", "test-mocks"]

[[test]]
name = "main"
path = "tests/main.rs"
required-features = ["test-mocks"]

[[test]]
name = "sdk_api_test"
path = "tests/sdk_api_test.rs"
required-features = ["test-mocks"]

# 临时诊断测试：依赖 presentation（platform 门控），非平台构建时跳过
[[test]]
name = "route_diag_test"
path = "tests/route_diag_test.rs"
required-features = ["platform"]

# BDD 验收套件：cucumber 自管 main（filter_run_and_exit 按标签过滤场景），
# 必须显式声明 harness=false，否则 auto-discover 挂 libtest 后找不到 #[test]，
# 二进制编译通过但 0 tests 空转（虚绿）。required-features 与 CI/文档运行口径一致。
[[test]]
name = "acceptance"
path = "tests/acceptance/main.rs"
harness = false
required-features = ["platform"]

[[bench]]
name = "benchmark"
harness = false
path = "benches/benchmark.rs"

[[bin]]
name = "crawlrs"
path = "src/main.rs"
required-features = ["platform"]

# =============================================================================
# Build Optimization Profiles
# =============================================================================

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
debug = true

[workspace]
members = ["examples"]

[workspace.package]
version = "0.2.0-rc.2"
edition = "2021"
rust-version = "1.97"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "Apache-2.0"
repository = "https://github.com/Kirky-X/crawlrs"

[workspace.dependencies]
# Async runtime（tokio 1.x default = []，显式关闭默认特性仅为声明纪律）
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
# Serialization
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# Configuration
confers = { version = "0.6.0-rc.6", default-features = false, features = ["validation", "toml", "env", "security-rules"] }
# Error handling
anyhow = { version = "1.0", default-features = false, features = ["std"] }
# Logging
log = { version = "0.4", default-features = false, features = ["std"] }
# Utilities
uuid = { version = "1.27", default-features = false, features = ["std", "v4", "serde"] }
# clock 显式声明：response_builder 等 Utc::now() 此前靠依赖图 feature 并集隐式获得
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
# Text processing
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
# Encoding（simd-unsafe 为上游默认携带的非对齐读 SIMD，产物裁剪时一并剥离）
base64 = { version = "0.23", default-features = false, features = ["std"] }
# Database
# 驱动与 runtime 特性不在此声明（Cargo feature 只加不减，写死会锁死单一后端），
# 由 crawlrs 的 db-postgres / db-sqlite / db-mysql 特性组按构建选择
dbnexus = { version = "0.6.0-rc.6", default-features = false, features = ["cache", "macros", "migration", "auto-migrate", "config-env", "config-toml", "with-chrono", "with-uuid", "with-json", "yaml", "permission", "health-check", "prepare-cache"] }
sea-orm = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-json"] }
# SDK
sdforge = { version = "0.5.0-rc.6", default-features = false, features = ["http"] }
# Web framework（form/matched-path/original-uri/tower-log/tracing 全仓零引用，裁掉）
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }

# =============================================================================
# Target-Specific Dependencies
# =============================================================================
# libc：MmapBloom 的 mmap/munmap 调用所需
# - Linux: MAP_HUGETLB 大页支持（性能优化）
# - 其他 Unix (macOS/BSD): 普通 mmap
# - 非 Unix (Windows/WASM): 不引入，bloom.rs 自动 fallback 到 Vec<u8> heap
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false, features = ["std"] }

[lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = [
    'cfg(feature, values("platform", "agent-lib", "engine-playwright", "engine-flaresolverr", "engine-tls-fingerprint", "engine-mllm", "metrics", "llm", "standard", "full", "openapi", "test-mocks", "teams", "auth", "rate-limit", "webhook", "content", "trafilatura", "dom-smoothie", "extractors", "http", "observability", "db-postgres", "db-sqlite", "db-mysql", "rag", "rag-local", "rag-remote"))'
]
