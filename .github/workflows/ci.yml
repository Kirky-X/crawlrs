name: CI

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  check-default:
    name: Check (default)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-default-deps
      - name: Check (default features)
        run: cargo check
      - name: Build (default features)
        run: cargo build

  check-full:
    name: Check (full features)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Check (full)
        run: cargo check --features "full"
      - name: Build (full)
        run: cargo build --features "full"

  embed-probe:
    name: Embed Probe (crawlrs as library)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 依赖默认构建通过后串行执行：探针以 path 依赖复现下游嵌入编译面，
    # 把「单仓绿、嵌入红」在 PR 阶段即阻断（R-embed-surface-004）。
    # 不加 continue-on-error —— 失败必须使 PR checks 呈红、阻塞合并。
    needs: check-default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-embed-probe
      - name: Run embedding probe
        run: scripts/embed-probe.sh

  feature-matrix:
    name: Feature Matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # R-flags-005: 覆盖 7 种 feature 组合，确保门控完整、无未门控引用
          # R-auth-engine-005: garrison 仅在 auth-on 时被引入依赖树
          #   - auth-off 组合（no-default/rate-limit-only/webhook-only）：expect-garrison=false
          #   - auth-on 组合（teams-only/auth-only/default/full）：expect-garrison=true
          #     （teams 隐含 auth，auth 隐含 dep:garrison，见 Cargo.toml [features]）
          - name: no-default
            flags: "--no-default-features"
            expect-garrison: false
          - name: teams-only
            flags: "--no-default-features --features teams"
            expect-garrison: true
          - name: auth-only
            flags: "--no-default-features --features auth"
            expect-garrison: true
          - name: rate-limit-only
            flags: "--no-default-features --features rate-limit"
            expect-garrison: false
          - name: webhook-only
            flags: "--no-default-features --features webhook"
            expect-garrison: false
          - name: default
            flags: "--features default"
            expect-garrison: true
          - name: full
            flags: "--features full"
            expect-garrison: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-feature-matrix-${{ matrix.name }}
      - name: Check feature combination
        run: cargo check ${{ matrix.flags }} --lib
      - name: Verify garrison feature gating (R-auth-engine-005)
        env:
          EXPECT_GARRISON: ${{ matrix.expect-garrison }}
          MATRIX_FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          # 确认 garrison 仅在 auth-on 编译
          # `cargo tree` 输出形如 `├── garrison v0.8.1`，grep `garrison v` 可稳定匹配
          # 分离 cargo tree 与 grep 退出码，避免 `|| true` 吞掉 cargo tree 失败
          tree_output=$(cargo tree $MATRIX_FLAGS 2>&1) || {
            echo "FAIL: cargo tree failed for flags: $MATRIX_FLAGS"
            echo "$tree_output"
            exit 1
          }
          count=$(echo "$tree_output" | grep -c "garrison v" || true)
          if [ "$EXPECT_GARRISON" = "true" ]; then
            expected=1
          else
            expected=0
          fi
          if [ "$count" -ge 1 ] && [ "$expected" = "1" ]; then
            echo "PASS: garrison found ($count occurrence(s)), expected present (flags: $MATRIX_FLAGS)"
          elif [ "$count" -eq 0 ] && [ "$expected" = "0" ]; then
            echo "PASS: garrison not found, expected absent (flags: $MATRIX_FLAGS)"
          else
            echo "FAIL: garrison found=$count, expected=$expected (flags: $MATRIX_FLAGS)"
            echo "--- cargo tree output (garrison matches) ---"
            echo "$tree_output" | grep -i "garrison" || true
            exit 1
          fi
      - name: Verify no RSA code paths (deny.toml RUSTSEC-2023-0071 premise)
        if: matrix.expect-garrison == true
        run: |
          set -euo pipefail
          # deny.toml 全局忽略 RUSTSEC-2023-0071（RSA Marvin Attack）
          # 的前提是 crawlrs 不调用任何 RSA 代码路径。此步骤自动化验证前提仍成立，
          # 防止未来引入 RSA 签名/验证代码时 ignore 静默失效。
          matches=$(grep -rE 'RS256|RS384|RS512|use rsa::|rsa::' src/ --include='*.rs' || true)
          if [ -n "$matches" ]; then
            echo "FAIL: found RSA code paths, deny.toml ignore for RUSTSEC-2023-0071 no longer safe:"
            echo "$matches"
            exit 1
          fi
          echo "PASS: no RSA code paths in src/, deny.toml ignore premise holds"
      - name: Verify no ECDSA code paths (deny.toml RUSTSEC-2026-0387 premise)
        if: matrix.expect-garrison == true
        run: |
          set -euo pipefail
          # deny.toml 忽略 RUSTSEC-2026-0387（crypto-bigint 常时运算时序变异）的前提
          # 是 crawlrs 走 HS256 对称 JWT，不调用任何 ECDSA 签名/验签路径。该依赖经
          # elliptic-curve 0.13 ← p256/p384 0.13 ← jsonwebtoken 引入，图内无 patched
          # 版本；此步骤自动化验证前提仍成立，防止未来改用 ES256/keystore 时 ignore
          # 静默变成真实风险。
          matches=$(grep -rE 'ES256|ES384|use p256::|use p384::|p256::|p384::|ecdsa::' src/ --include='*.rs' || true)
          if [ -n "$matches" ]; then
            echo "FAIL: found ECDSA code paths, deny.toml ignore for RUSTSEC-2026-0387 no longer safe:"
            echo "$matches"
            exit 1
          fi
          echo "PASS: no ECDSA code paths in src/, deny.toml ignore premise holds"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Clippy (standard)
        run: cargo clippy --features "standard" -- -D warnings
      - name: Clippy (full)
        run: cargo clippy --features "full" -- -D warnings
      # engine-moli 特性组合防 feature rot（内存水位调度 + MoliEngine 门控代码
      # 不在 standard/full 内，缺此腿则 CI 永不编译该面）
      - name: Clippy (engine-moli)
        run: cargo clippy --features "engine-moli,engine-playwright,metrics" -- -D warnings

  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # MSRV 与 Cargo.toml rust-version = "1.97" 对齐（0.2.0-rc.2 起自研依赖
        # confers/dbnexus/inklog/limiteron/oxcache/sdforge/trait-kit 0.x-rc.5+
        # 均要求 rustc 1.97.1，1.95 腿在 cargo resolve 阶段即报 MSRV 不满足）
        # 注：toolchain "1.97" 解析为最新 1.97.x（即 1.97.1）
        rust: [1.97, stable]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawlrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-deps-${{ matrix.rust }}
      - name: Assert postgres migrations present
        run: |
          ls migrations/postgres/*.sql >/dev/null 2>&1 || {
            echo "error: no migrations/postgres/*.sql found (misplaced migration files?)" >&2
            exit 1
          }
      - name: Run database migrations
        run: |  # pragma: allowlist secret
          for f in migrations/postgres/*.sql; do
            PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d crawlrs_test -f "$f"  # pragma: allowlist secret
          done
      - name: Test (standard, lib)
        run: cargo test --features "standard" --lib
      - name: Test (full, lib)
        run: cargo test --features "full" --lib
      - name: Run tests (engine-moli)
        run: cargo test --features "engine-moli,engine-playwright,metrics" --lib

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Build docs
        run: cargo doc --features "full" --no-deps

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawlrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Assert postgres migrations present
        run: |
          ls migrations/postgres/*.sql >/dev/null 2>&1 || {
            echo "error: no migrations/postgres/*.sql found (misplaced migration files?)" >&2
            exit 1
          }
      - name: Run database migrations
        run: |  # pragma: allowlist secret
          for f in migrations/postgres/*.sql; do
            PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d crawlrs_test -f "$f"  # pragma: allowlist secret
          done
      - name: Integration tests (full + test-mocks)
        run: cargo test --features "full,test-mocks" --tests --no-fail-fast

  acceptance-test:
    name: BDD Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawlrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
      CRAWLRS_DISABLE_SSRF_PROTECTION: "true"
      CRAWLRS__AUTH__JWT_SECRET: ci-acceptance-test-strong-secret-key-32bytes!!
      CRAWLRS__WEBHOOK__SECRET: whsec-ci-acceptance-webhook-secret
      CRAWLRS_ACCEPTANCE_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-acceptance-deps
      # CI 用 service 容器（TEST_DATABASE_URL 由套件 resolve 优先读取，
      # 避免 testcontainers 冷启动）；必须先应用 migrations 再跑 BDD。
      - name: Assert postgres migrations present
        run: |
          ls migrations/postgres/*.sql >/dev/null 2>&1 || {
            echo "error: no migrations/postgres/*.sql found (misplaced migration files?)" >&2
            exit 1
          }
      - name: Run database migrations
        run: |  # pragma: allowlist secret
          for f in migrations/postgres/*.sql; do
            PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d crawlrs_test -f "$f"  # pragma: allowlist secret
          done
      - name: BDD acceptance tests (platform, excl. @external)
        run: cargo test --test acceptance --features platform

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # 实测基线 ~30m16s（llvm-cov 全量编译+lib/test 双轮），30 分钟阈值边缘超时
    # （f9653bc0 CI Coverage 作业被 cancelled），抬高到 45 分钟留出 runner 波动余量
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawlrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      - name: Assert postgres migrations present
        run: |
          ls migrations/postgres/*.sql >/dev/null 2>&1 || {
            echo "error: no migrations/postgres/*.sql found (misplaced migration files?)" >&2
            exit 1
          }
      - name: Run database migrations
        run: |  # pragma: allowlist secret
          for f in migrations/postgres/*.sql; do
            PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d crawlrs_test -f "$f"  # pragma: allowlist secret
          done
      - name: Run coverage (fail under 80% lines)
        run: cargo llvm-cov --features "full" --fail-under-lines 80 --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false

  mysql-migrations:
    # MySQL 迁移此前只有静态解析（migration_dialect），无运行时执行验证。
    # 本作业真实执行 001→010，重跑 009/010 验证幂等，
    # 并断言 url_hash 定义与唯一索引列序。
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          # 一次性 CI service 容器夹具，非真实凭据
          MYSQL_ROOT_PASSWORD: root  # pragma: allowlist secret
          MYSQL_DATABASE: crawlrs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql -uroot -proot -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=40
    env:
      MYSQL: mysql -h127.0.0.1 -uroot -proot crawlrs_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply migrations 001→010
        run: |
          set -euo pipefail
          for f in migrations/mysql/*.sql; do
            echo "::group::apply $f"
            $MYSQL < "$f"
            echo "::endgroup::"
          done
      - name: Rerun 009/010 (idempotency)
        run: |
          set -euo pipefail
          $MYSQL < migrations/mysql/009_add_crawl_task_url_unique.sql
          $MYSQL < migrations/mysql/010_upgrade_crawl_task_url_hash_definition.sql
      - name: Assert url_hash definition and unique index
        run: |
          set -euo pipefail
          # mysql -N 输出列间为 TAB：分列断言，避免空白符匹配脆弱性
          ctype=$($MYSQL -N -e "SELECT column_type FROM information_schema.columns WHERE table_schema='crawlrs_test' AND table_name='tasks' AND column_name='url_hash'")
          extra=$($MYSQL -N -e "SELECT extra FROM information_schema.columns WHERE table_schema='crawlrs_test' AND table_name='tasks' AND column_name='url_hash'")
          echo "url_hash: type=$ctype extra=$extra"
          [ "$ctype" = "binary(32)" ]
          echo "$extra" | grep -q 'VIRTUAL GENERATED'
          cols=$($MYSQL -N -e "SELECT GROUP_CONCAT(column_name ORDER BY seq_in_index) FROM information_schema.statistics WHERE table_schema='crawlrs_test' AND table_name='tasks' AND index_name='idx_tasks_crawl_url_unique'")
          echo "index cols: $cols"
          [ "$cols" = "crawl_id,url_hash" ]
      - name: Unique semantics smoke (long URL + case coexistence)
        run: |
          set -euo pipefail
