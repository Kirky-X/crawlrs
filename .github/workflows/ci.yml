name: CI

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  check-default:
    name: Check (default)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-default-deps
      - name: Check (default features)
        run: cargo check
      - name: Build (default features)
        run: cargo build

  check-full:
    name: Check (full features)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Check (full)
        run: cargo check --features "full"
      - name: Build (full)
        run: cargo build --features "full"

  feature-matrix:
    name: Feature Matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # R-flags-005: 覆盖 7 种 feature 组合，确保门控完整、无未门控引用
          # R-auth-engine-005 (T032): garrison 仅在 auth-on 时被引入依赖树
          #   - auth-off 组合（no-default/rate-limit-only/webhook-only）：expect-garrison=false
          #   - auth-on 组合（teams-only/auth-only/default/full）：expect-garrison=true
          #     （teams 隐含 auth，auth 隐含 dep:garrison，见 Cargo.toml [features]）
          - name: no-default
            flags: "--no-default-features"
            expect-garrison: false
          - name: teams-only
            flags: "--no-default-features --features teams"
            expect-garrison: true
          - name: auth-only
            flags: "--no-default-features --features auth"
            expect-garrison: true
          - name: rate-limit-only
            flags: "--no-default-features --features rate-limit"
            expect-garrison: false
          - name: webhook-only
            flags: "--no-default-features --features webhook"
            expect-garrison: false
          - name: default
            flags: "--features default"
            expect-garrison: true
          - name: full
            flags: "--features full"
            expect-garrison: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-feature-matrix-${{ matrix.name }}
      - name: Check feature combination
        run: cargo check ${{ matrix.flags }} --lib
      - name: Verify garrison feature gating (R-auth-engine-005)
        env:
          EXPECT_GARRISON: ${{ matrix.expect-garrison }}
          MATRIX_FLAGS: ${{ matrix.flags }}
        run: |
          set -euo pipefail
          # T032: 确认 garrison 仅在 auth-on 编译
          # `cargo tree` 输出形如 `├── garrison v0.8.1`，grep `garrison v` 可稳定匹配
          # 安全审查 L1 修复：分离 cargo tree 与 grep 退出码，避免 `|| true` 吞掉 cargo tree 失败
          tree_output=$(cargo tree $MATRIX_FLAGS 2>&1) || {
            echo "FAIL: cargo tree failed for flags: $MATRIX_FLAGS"
            echo "$tree_output"
            exit 1
          }
          count=$(echo "$tree_output" | grep -c "garrison v" || true)
          if [ "$EXPECT_GARRISON" = "true" ]; then
            expected=1
          else
            expected=0
          fi
          if [ "$count" -ge 1 ] && [ "$expected" = "1" ]; then
            echo "PASS: garrison found ($count occurrence(s)), expected present (flags: $MATRIX_FLAGS)"
          elif [ "$count" -eq 0 ] && [ "$expected" = "0" ]; then
            echo "PASS: garrison not found, expected absent (flags: $MATRIX_FLAGS)"
          else
            echo "FAIL: garrison found=$count, expected=$expected (flags: $MATRIX_FLAGS)"
            echo "--- cargo tree output (garrison matches) ---"
            echo "$tree_output" | grep -i "garrison" || true
            exit 1
          fi
      - name: Verify no RSA code paths (deny.toml RUSTSEC-2023-0071 premise)
        if: matrix.expect-garrison == true
        run: |
          set -euo pipefail
          # 安全审查 H1 修复：deny.toml 全局忽略 RUSTSEC-2023-0071（RSA Marvin Attack）
          # 的前提是 crawlrs 不调用任何 RSA 代码路径。此步骤自动化验证前提仍成立，
          # 防止未来引入 RSA 签名/验证代码时 ignore 静默失效。
          matches=$(grep -rE 'RS256|RS384|RS512|use rsa::|rsa::' src/ --include='*.rs' || true)
          if [ -n "$matches" ]; then
            echo "FAIL: found RSA code paths, deny.toml ignore for RUSTSEC-2023-0071 no longer safe:"
            echo "$matches"
            exit 1
          fi
          echo "PASS: no RSA code paths in src/, deny.toml ignore premise holds"

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Clippy (standard)
        run: cargo clippy --features "standard" -- -D warnings
      - name: Clippy (full)
        run: cargo clippy --features "full" -- -D warnings

  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rust: [1.95, stable]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawlrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-test-deps-${{ matrix.rust }}
      - name: Run database migrations
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d crawlrs_test -f "$f"
          done
      - name: Test (standard, lib)
        run: cargo test --features "standard" --lib
      - name: Test (full, lib)
        run: cargo test --features "full" --lib

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Build docs
        run: cargo doc --features "full" --no-deps

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawlrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Run database migrations
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d crawlrs_test -f "$f"
          done
      - name: Integration tests (full + test-mocks)
        run: cargo test --features "full,test-mocks" --tests --no-fail-fast

  acceptance-test:
    name: BDD Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
      CRAWLRS_DISABLE_SSRF_PROTECTION: "true"
      CRAWLRS__AUTH__JWT_SECRET: ci-acceptance-test-strong-secret-key-32bytes!!
      CRAWLRS__WEBHOOK__SECRET: whsec-ci-acceptance-webhook-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-acceptance-deps
      # 套件经 testcontainers 自起 PG（需 Docker，ubuntu runner 自带）；
      # TEST_DATABASE_URL 由套件内 resolve 优先读取——CI 用 service 容器减少启动时间
      - name: BDD acceptance tests (platform, excl. @external)
        run: cargo test --test acceptance --features platform -- --tags "not @external"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crawlrs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/crawlrs_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install protoc (sdforge build dep)
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # protoc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-full-deps
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@d5b1c57492c40991d5b03b58d85d06c3626b7542 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov
      - name: Run database migrations
        run: |
          for f in migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d crawlrs_test -f "$f"
          done
      - name: Run coverage (fail under 80% lines)
        run: cargo llvm-cov --features "full" --fail-under-lines 80 --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false
