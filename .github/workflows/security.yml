# 安全与质量检查统一 workflow（2026-11-17 合并）。
# 由三份 push/PR 触发的 workflow 合并而来：
#   - security.yml 原内容：actionlint / zizmor / gitleaks / cargo-audit / trivy
#   - codeql.yml 原内容：CodeQL 静态分析（analyze）
#   - check-tech-debt.yml 原内容：技术债巡检（check-tech-debt）
# 自本次合并起不再随 push/pull_request 触发，改为：
#   - schedule：每周二 04:37 UTC（复用原 CodeQL 的 cron `37 4 * * 2`）
#   - workflow_dispatch 手动派发
# push/PR 门禁由 ci.yml 唯一承担。
name: security

on:
  schedule:
    - cron: "37 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # rustsec/audit-check v2 把审计结果以 check-run 形式回写（含已豁免警告的
      # 注记），缺该权限时报 "Resource not accessible by integration"（R-17 实证）。
      # 原先挂在 workflow 顶层；合并后收窄到本 job（CodeQL/tech-debt 不需要）。
      checks: write
    steps:
      # 写法对齐 vecboost/garrison/CodeNexus 同一 workflow：SHA 钉 + fetch-depth: 0。
      # 浅克隆会让 gitleaks-action 的 `<head>^..<head>` 区间无法解析（报
      # "unknown revision" 后空转退 1），@v4 同时是 zizmor 的 unpinned-uses 发现项。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: actionlint
        # Docker Hub 上该镜像 tag 无 `v` 前缀（v1.7.7 为 404，实际 tag 为 1.7.7）；
        # 钉 manifest digest 避免 tag 被重指向。
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          # shellcheck 子检查降到 error 级：YAML 语法/表达式错误仍阻断，
          # 风格级（SC2086/SC2034 等）不阻断，避免打断既有流水线。
          args: -color -shellcheck=error
      - name: zizmor (GitHub Actions 安全审计)
        # 版本修正（外部事实）：`v0.12.0` 在 zizmorcore/zizmor-action 仓库不存在
        # （API 核对 tags 最高到 v0.7.1），作业在 "Getting action download info"
        # 阶段就红，`continue-on-error` 对这种 action 解析失败无效（garrison
        # 同缺陷已证实）。改用 SHA 钉的 v0.7.1；本仓既有 workflow 的
        # unpinned-uses backlog 未清零，保留非阻断语义。
        continue-on-error: true
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      - name: gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action v3.0.0 扫描强制要求 GITHUB_TOKEN，
          # 缺失时进程直接 exit 1。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: cargo-audit (RustSec 漏洞)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # 不引入 cargo-vet：`cargo vet verify` 以仓库根存在 supply-chain/（vet.toml /
      # imports.lock）为前提，本仓没有该目录，保留只会必红。依赖来源审计由
      # 上面的 cargo-audit 与 ci.yml 的 cargo-deny 承担（vecboost/CodeNexus 同口径）。
      - name: trivy (文件系统/依赖漏洞)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH

  analyze:
    # 原 codeql.yml（name: CodeQL）的唯一 job，内容原样保留
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:autodetect"

  check-tech-debt:
    # 原 check-tech-debt.yml（name: Code Quality Check）的唯一 job，内容原样保留。
    # 其 pull_request 分支逻辑（EVENT_NAME/BASE_REF）在 schedule/dispatch 下自然跳过。
    name: Check Tech Debt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          rust-version: stable

      - name: Check for new anyhow usage
        id: anyhow-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Count current anyhow::Result usage
          CURRENT_ANYHOW=$(rg "anyhow::Result" --type rust | wc -l)
          echo "Current anyhow::Result usage: $CURRENT_ANYHOW files"
          echo "anyhow_count=$CURRENT_ANYHOW" >> $GITHUB_OUTPUT

          # Check for new anyhow::Result in this PR
          if [ "$EVENT_NAME" == "pull_request" ]; then
            # Get files changed in this PR
            NEW_ANYHOW=$(git diff --name-only "origin/$BASE_REF" HEAD | xargs rg -l "anyhow::Result" 2>/dev/null | wc -l || echo "0")
            echo "New anyhow::Result files in this PR: $NEW_ANYHOW"
            if [ "$NEW_ANYHOW" -gt 0 ]; then
              echo "::warning::Found $NEW_ANYHOW new file(s) using anyhow::Result. Consider using custom error types instead."
              git diff --name-only "origin/$BASE_REF" HEAD | xargs rg "anyhow::Result" 2>/dev/null || true
            fi
          fi

      - name: Check for hardcoded worker count
        run: |
          # Check for hardcoded worker count in main.rs
          if rg "start_workers\([0-9]\)" src/main.rs > /dev/null; then
            echo "::warning::Found hardcoded worker count in main.rs. Consider using configuration."
          fi

      - name: Check for hardcoded Duration values
        id: duration-check
        run: |
          # Count hardcoded Duration::from_secs (excluding tests)
          HARDCODE_DURATION=$(rg "Duration::from_secs\(" --type rust src/ | grep -v "#[cfg(test)]" | grep -v "mod tests" | wc -l)
          echo "Hardcoded Duration values (non-test): $HARDCODE_DURATION files"
          echo "duration_count=$HARDCODE_DURATION" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "=== Tech Debt Summary ==="
          echo "anyhow::Result files: ${{ steps.anyhow-check.outputs.anyhow_count }}"
          echo "Hardcoded Duration files: ${{ steps.duration-check.outputs.duration_count }}"
          echo "========================"
