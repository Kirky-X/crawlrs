version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    reviewers: ["kirky"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      patch:
        update-types: ["patch"]
      minor:
        update-types: ["minor"]
    # patch 级版本更新关闭自动 PR（2026-11-16）
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    reviewers: ["kirky"]
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    # patch 级版本更新关闭自动 PR（2026-11-16）
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
