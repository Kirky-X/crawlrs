# pre-commit 配置 — 与 base/inklog 同基线，cargo 钩子口径对齐本仓 .github/workflows/ci.yml
# （crawlrs 为 [workspace] members = ["examples"]，故用 --all；不可用 --all-features：
#  db-postgres/db-sqlite/db-mysql 互斥、rag-local/rag-remote 互斥，由 dbnexus 编译期强制）
# 安装: pip install pre-commit && pre-commit install
#       pre-commit install --hook-type post-commit   # 启用提交后清理
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
      - id: check-merge-conflict
        args: ['--assume-in-merge']
        # 注意：本仓工作流直接在 main 分支提交，故不启用 no-commit-to-branch
        #（启用会拦下 main 上的全部提交；该钩子在 inklog 模板中已删除）

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--exclude-files, tests/, --exclude-files, examples/]
        exclude: '^Cargo\.lock$'

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Format Rust code
        description: Run rustfmt on Rust files（对齐 ci.yml 的 fmt 作业 cargo fmt --all -- --check）
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        description: 默认特性编译检查（对齐 ci.yml 的 check-default 作业 cargo check）
        entry: cargo check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: >-
          Clippy 门禁（对齐 ci.yml 的 clippy 作业）。CI 分 standard/full 两次跑，
          full ⊇ standard，此处取 full 单次覆盖，避免重复编译
        entry: cargo clippy --features "full" -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # === 提交完成后清理本地编译产物（post-commit 阶段；启用: pre-commit install -t post-commit） ===
  - repo: local
    hooks:
      - id: post-commit-clean
        name: clean local build artifacts (cargo target + python)
        entry: >-
          bash -c 'cargo clean >/dev/null 2>&1;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d -name target -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .hypothesis -o -name "*.egg-info" \) -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type f \( -name "*.pyc" -o -name "*.pyo" \) -exec rm -f {} +;
          if [ -z "$(git ls-files build dist)" ]; then rm -rf build dist; fi;
          echo "[post-commit] 已清理 cargo target 与 Python 编译产物"'
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-commit]
ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"

# 全局阶段约束
default_stages: [pre-commit]  # 锁定未显式声明 stages 的 hook，避免污染 post-commit 等阶段
