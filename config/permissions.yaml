# DBNexus 权限配置文件
# 位于: config/permissions.yaml
#
# 使用 dbnexus 的声明式权限控制
# 格式: roles.<role_name>.tables.<table_name>.operations
#
# 可用操作:
# - SELECT: 查询数据
# - INSERT: 插入新数据
# - UPDATE: 更新数据
# - DELETE: 删除数据
#
# 特殊角色:
# - admin: 管理员角色，拥有完全访问权限
#   系统自动将 admin 角色的用户视为超级用户
#
# 表名说明: 所有表名使用复数形式以与数据库保持一致

roles:
  # 管理员角色 - 完全权限
  admin:
    description: "Administrator with full access to all tables and operations"
    tables:
      # 核心业务表
      - name: teams
        operations: ["select", "insert", "update", "delete"]
      - name: api_keys
        operations: ["select", "insert", "update", "delete"]
      - name: tasks
        operations: ["select", "insert", "update", "delete"]
      - name: crawls
        operations: ["select", "insert", "update", "delete"]
      - name: scrape_results
        operations: ["select", "insert", "update", "delete"]
      - name: webhooks
        operations: ["select", "insert", "update", "delete"]
      - name: webhook_events
        operations: ["select", "insert", "update", "delete"]
      - name: tasks_backlog
        operations: ["select", "insert", "update", "delete"]
      # 积分相关表
      - name: credits
        operations: ["select", "insert", "update", "delete"]
      - name: credits_transactions
        operations: ["select", "insert", "update", "delete"]
      # 审计和配置表
      - name: geo_restriction_logs
        operations: ["select", "insert", "update", "delete"]
      - name: audit_logs
        operations: ["select", "insert", "update", "delete"]
      # 架构 MEDIUM-3：feature_flags 与 feature_flag_overrides 已通过
      # migrations/004_drop_feature_flags.sql 删除（dead schema），
      # 权限配置同步清理。
      - name: scopes
        operations: ["select", "insert", "update", "delete"]

  # API 用户角色 - 应用程序访问
  api_user:
    description: "API user role - standard application access"
    tables:
      - name: tasks
        operations: ["select", "insert", "update"]
      - name: crawls
        operations: ["select", "insert", "update"]
      - name: scrape_results
        operations: ["select", "insert"]
      - name: webhooks
        operations: ["select", "insert", "update"]
      - name: webhook_events
        operations: ["select", "insert"]
      - name: tasks_backlog
        operations: ["select", "insert", "update"]
      - name: credits
        operations: ["select"]
      - name: credits_transactions
        operations: ["select", "insert"]
      - name: teams
        operations: ["select"]
      - name: api_keys
        operations: ["select"]

  # 查看器角色 - 只读访问
  viewer:
    description: "Read-only access - can view data but not modify"
    tables:
      - name: tasks
        operations: ["select"]
      - name: crawls
        operations: ["select"]
      - name: scrape_results
        operations: ["select"]
      - name: webhooks
        operations: ["select"]
      - name: webhook_events
        operations: ["select"]
      - name: tasks_backlog
        operations: ["select"]
      - name: credits
        operations: ["select"]
      - name: credits_transactions
        operations: ["select"]
      - name: teams
        operations: ["select"]
      - name: api_keys
        operations: ["select"]
      - name: audit_logs
        operations: ["select"]
      # 架构 MEDIUM-3：feature_flags 权限已清理（表已删除）
      - name: scopes
        operations: ["select"]

  # 系统角色 - 后台服务和内部调用
  system:
    description: "System service account - minimal required permissions"
    tables:
      - name: tasks
        operations: ["select", "insert", "update"]
      - name: crawls
        operations: ["select", "insert", "update"]
      - name: scrape_results
        operations: ["select", "insert"]
      - name: tasks_backlog
        operations: ["select", "insert", "update"]
      - name: webhook_events
        operations: ["select", "insert"]
      - name: credits
        operations: ["select", "update"]
      - name: credits_transactions
        operations: ["insert"]
      - name: geo_restriction_logs
        operations: ["select", "insert"]
      - name: audit_logs
        operations: ["select", "insert"]
      - name: teams
        operations: ["select"]
      - name: webhooks
        operations: ["select"]

  # 爬虫角色 - 爬取任务管理
  scraper:
    description: "Scraper role - can create and manage scraping tasks"
    tables:
      - name: tasks
        operations: ["select", "insert"]
      - name: crawls
        operations: ["select", "insert"]
      - name: scrape_results
        operations: ["select", "insert"]
      - name: tasks_backlog
        operations: ["select", "insert"]
      - name: credits
        operations: ["select"]
      - name: webhook_events
        operations: ["select", "insert"]
      - name: webhooks
        operations: ["select"]
