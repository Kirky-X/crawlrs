# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# RUSTSEC-2026-0459: libsqlite3-sys 0.37.0 绑定的 C SQLite CVE-2026-119375
# （特制 DB + 同名 -wal 页大小不一致导致未初始化页缓存内存泄露；攻击向量需本地
# 打开攻击者可控文件对）。修复版 0.39.0 被 sqlx-sqlite 0.9.0 的
# `>=0.30.1, <0.38.0` 约束挡住，需等 sqlx/sea-orm 链升级；本 crate 仅在可选
# db-sqlite feature 下引入该依赖。依赖链解锁后移除本条。
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# unmaintained 通告真实参与评估（默认不评估会让 ignore 列表里的 unmaintained 条目
# 变成"未被检测到"的死豁免；"all" 覆盖全部依赖图，含传递依赖）
unmaintained = "all"
# RUSTSEC-2023-0071: rsa Marvin Attack（jsonwebtoken rust_crypto 后端携带 rsa v0.9.10）。
# 2026-10-03：crawlrs 的 jsonwebtoken 直接声明已移除（src 零引用死依赖），
# 残余路径仅 garrison(auth) → jsonwebtoken → rsa 单条。风险评估：crawlrs 仅用
# HS256 对称 JWT，不调用 rsa crate 任何函数，攻击面为零。待上游提供无 rsa 的
# 后端或 rsa 发布修复后移除。
# （原 RUSTSEC-2026-0173 proc-macro-error2 已不再出现于依赖树，ignore 已移除。）
#
# RUSTSEC-2026-0285: rustls TLS 1.3 握手消息跨加密层边界被错误接受（crypto-failure，
# CVSS 5.3 MEDIUM，官方 patched >=0.23.45，2026-09-14 发布）。
# 追加（2026-10-17 embed-readiness）：RUSTSEC-2026-0346/0347/0348/0349（rustls Debug 泄漏
# TLS secret、ECH 拒绝后外发缓冲、Brotli 证书解压 1GiB 预分配、未认证 ServerHello 降级）
# patched >=0.23.46。已将 rustls 升至此版本（cargo update -p rustls --precise 0.23.46），
# `cargo deny check` 无 rustls 告警，无需 ignore。后续 rustls 相关变更随门禁一并复核。
#
# - RUSTSEC-2024-0436: paste（可选 rag-local → vecboost → tokenizers 传递；编译期 proc-macro，
#   无运行时攻击面。cargo-deny 仅在 --all-features 图触达，CI action 默认即 --all-features）
# - RUSTSEC-2025-0119: number_prefix（可选 rag-local → vecboost → tokenizers → hf-hub →
#   indicatif 传递；仅进度条数字格式化）
# 2026-11-06 依赖全量升级后 RUSTSEC-2024-0449（unsafe-libyaml）宿主已退出依赖树，ignore 已移除。
#
# 注：RUSTSEC-2026-0367/0368/0369（zip 8.6.0）不靠 ignore 处理——已整体移除死依赖
# chromiumoxide_fetcher（见 Cargo.toml），zip 退出依赖树，告警自动消除。
#
# RUSTSEC-2026-0387: crypto-bigint 0.5.5 常时运算时序变异（crypto-failure，2026-10-23，
# 官方 patched >=0.7.6）。引入路径与 garrison 侧同源：elliptic-curve 0.13 ← p256/p384 0.13
# ← jsonwebtoken 11.1.0 ← garrison(protocol-jwt)。jsonwebtoken 最新发布 11.1.0 仍锁 0.13-gen，
# 修补需 RustCrypto 0.14-gen 栈，图内无 patched 路径；crawlrs 仅用 HS256 对称 JWT、
# 不调用 ECDSA 签名/验签，攻击面为零。上游迁移后（jsonwebtoken 支持 p256 0.14 一线）解除。
# 同口径见 garrison/deny.toml（兄弟仓已先行豁免，本仓机械对齐）。
# RUSTSEC-2026-0440: astral-tokio-tar 0.6.4 停止维护（unmaintained，2026-11-03）。
# 唯一引入路径 testcontainers 0.27.3 → testcontainers-modules 0.15.0，均 [dev-dependencies]，
# 不进任何发布二进制；集成测试的容器镜像 tar 解包用。unmaintained 非漏洞，上游 testcontainers
# 换 tar-codec 后移除本豁免（tracking: testcontainers-rs 上游 changelog）。
# 注意：cargo-deny 默认图不含 dev-deps，会打 "no crate matched" note（无害）；
# cargo-audit 的图含 dev-deps，此豁免对 audit 是必需的（两处须同源保留）。
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2024-0436", "RUSTSEC-2025-0119", "RUSTSEC-2026-0387", "RUSTSEC-2026-0440", "RUSTSEC-2026-0459"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", "BSD-2-Clause", "ISC",
    "Unicode-3.0", "Unicode-DFS-2016",
    "Zlib", "CC0-1.0", "MPL-2.0",
    "CDLA-Permissive-2.0", "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# 无 git 源依赖（fluxweir 已回归 registry 0.1.1；moli-html2md 已随 alchemize
# 收编移除——两个历史 git 源均不再存在）。显式空表保留：unexpected git 源仍被
# unknown-git = "deny" 拦截。
allow-git = []
