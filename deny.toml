# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# RUSTSEC-2023-0071: rsa Marvin Attack（jsonwebtoken rust_crypto 后端携带 rsa v0.9.10）。
# 2026-10-03：crawlrs 的 jsonwebtoken 直接声明已移除（src 零引用死依赖），
# 残余路径仅 garrison(auth) → jsonwebtoken → rsa 单条。风险评估：crawlrs 仅用
# HS256 对称 JWT，不调用 rsa crate 任何函数，攻击面为零。待上游提供无 rsa 的
# 后端或 rsa 发布修复后移除。
# （原 RUSTSEC-2026-0173 proc-macro-error2 已不再出现于依赖树，ignore 已移除。）
#
# RUSTSEC-2026-0285: rustls TLS 1.3 握手消息跨加密层边界被错误接受（crypto-failure，
# CVSS 5.3 MEDIUM，官方 patched >=0.23.45，2026-09-14 发布）。
# 追加（2026-10-17 embed-readiness）：RUSTSEC-2026-0346/0347/0348/0349（rustls Debug 泄漏
# TLS secret、ECH 拒绝后外发缓冲、Brotli 证书解压 1GiB 预分配、未认证 ServerHello 降级）
# patched >=0.23.46。已将 rustls 升至此版本（cargo update -p rustls --precise 0.23.46），
# `cargo deny check` 无 rustls 告警，无需 ignore。后续 rustls 相关变更随门禁一并复核。
#
# 以下 advisory 为传递依赖中已停止维护的 crate，无可用升级版本，待上游迁移后移除：
# - RUSTSEC-2024-0436: paste（vecboost → candle-core/gemm 传递依赖，编译期 proc-macro，
#   无运行时攻击面；merge 时自旧线恢复该 ignore，cargo-deny-action 默认
#   --all-features 才会扫到）
# - RUSTSEC-2025-0119: number_prefix（vecboost → hf-hub → indicatif 传递依赖，
#   仅进度条数字格式化，无运行时攻击面）
# - RUSTSEC-2024-0449: unsafe-libyaml（confers/dbnexus → serde_yaml_ng 传递依赖，
#   为 libyaml C 代码的机器翻译，官方已归档、patched 为空 = 永久无修复版；informational
#   unmaintained 非漏洞，无已知 CVE，运行时仅做 YAML 解析。待家族侧 yaml 引擎迁移后移除）
#
# 注：RUSTSEC-2026-0367/0368/0369（zip 8.6.0）不靠 ignore 处理——已整体移除死依赖
# chromiumoxide_fetcher（见 Cargo.toml），zip 退出依赖树，告警自动消除。
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2024-0436", "RUSTSEC-2025-0119", "RUSTSEC-2024-0449"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", "BSD-2-Clause", "ISC",
    "Unicode-3.0", "Unicode-DFS-2016",
    "Zlib", "CC0-1.0", "MPL-2.0",
    "CDLA-Permissive-2.0", "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
