# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# RUSTSEC-2023-0071: rsa Marvin Attack（jsonwebtoken v11.0 rust_crypto 后端携带 rsa v0.9.10，
# crawlrs 与 garrison 双路径传递）。风险评估：crawlrs 仅用 HS256 对称 JWT，
# 不调用 rsa crate 任何函数，攻击面为零。待上游提供无 rsa 的后端或 rsa 发布修复后移除。
# （原 RUSTSEC-2026-0173 proc-macro-error2 已不再出现于依赖树，ignore 已移除。）
#
# RUSTSEC-2026-0285: rustls TLS 1.3 握手消息跨加密层边界被错误接受（crypto-failure，
# CVSS 5.3 MEDIUM，官方 patched >=0.23.45，2026-09-14 发布）。复查（2026-09-15）：
# 依赖树 rustls 已锁定 0.23.45 = 修复版本，`cargo deny check` 报告 advisories ok，
# 无需 ignore 也无需进一步升级。后续 rustls 相关依赖变更时随 `cargo deny check` 一并复核。
#
# 以下 advisory 为传递依赖中已停止维护的 crate，无可用升级版本，待上游迁移后移除：
# - RUSTSEC-2024-0436: paste（vecboost → candle-core/gemm 传递依赖，编译期 proc-macro，
#   无运行时攻击面；merge 时自旧线恢复该 ignore，cargo-deny-action 默认
#   --all-features 才会扫到）
# - RUSTSEC-2025-0119: number_prefix（vecboost → hf-hub → indicatif 传递依赖，
#   仅进度条数字格式化，无运行时攻击面）
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2024-0436", "RUSTSEC-2025-0119"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", "BSD-2-Clause", "ISC",
    "Unicode-3.0", "Unicode-DFS-2016",
    "Zlib", "CC0-1.0", "MPL-2.0",
    "CDLA-Permissive-2.0", "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
