# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# 以下 advisory 为传递依赖中已停止维护的 crate，无可用升级，待上游迁移后移除：
# - RUSTSEC-2026-0173: proc-macro-error2（dbnexus/sea-orm/inklog 依赖）
# - RUSTSEC-2024-0436: paste（inklog → parquet 依赖）
# - RUSTSEC-2023-0071: rsa Marvin Attack（garrison → jsonwebtoken v10.4.0 → rsa v0.9.10）
#   风险评估（garrison-auth-migration T034 决策）：
#   - 漏洞性质：RSA 非常量时间实现，timing sidechannel 泄露私钥（CVSS 5.9 MEDIUM）
#   - 影响范围：仅 RSA 算法（RS256/RS384/RS512）的签名/验证路径
#   - crawlrs 实际影响：无。`build_garrison_config` 中 `jwt_algorithm = "HS256"`，
#     `jwt_secret` 为 HMAC-SHA256 密钥（≥32 字节），不调用 rsa crate 任何函数
#     （grep `RS256|RS384|RS512|use rsa::` 全项目零匹配验证）
#   - 升级路径：garrison v0.8.1 强制 jsonwebtoken ^10，无法升级到 11.0.0
#     （`cargo update -p jsonwebtoken --precise 11.0.0` 失败：`failed to select a version`）
#   - 缓解措施：crawlrs 不暴露 RSA 签名/验证端点，不读取外部 RSA 密钥，
#     garrison 仅用 HS256 签发 API Key token，timing sidechannel 攻击面为零
#   - 待 garrison 上游升级到 jsonwebtoken 11.x 后，移除此 ignore
ignore = ["RUSTSEC-2026-0173", "RUSTSEC-2024-0436", "RUSTSEC-2023-0071"]

[licenses]
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause", "BSD-2-Clause", "ISC",
    "Unicode-3.0", "Unicode-DFS-2016",
    "Zlib", "CC0-1.0", "MPL-2.0",
    "CDLA-Permissive-2.0", "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
